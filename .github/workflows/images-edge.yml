# Images for trying out what is not released yet, of every commit on main (tag "edge") and on a release branch
# (release/0.2 gives the tag "release-0.2"), plus "sha-<commit>" for both. Not signed and never "latest":
# released versions come from release.yml only.
name: Images (edge)

on:
  push:
    branches: [main, "release/**"]

permissions:
  contents: read

jobs:
  edge:
    name: Image ${{ matrix.image }}
    # Only in the main repository, which has the Docker Hub secrets.
    if: github.repository == 'erik1g/study-manager'
    runs-on: ubuntu-latest
    # The Docker Hub secrets live in this environment, which may be used from main and release/* only.
    environment: edge
    strategy:
      matrix:
        image: [server, web]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/study-manager-${{ matrix.image }}
          tags: |
            type=edge,branch=main
            type=ref,event=branch,enable=${{ startsWith(github.ref, 'refs/heads/release/') }}
            type=sha,format=short
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: infra/docker/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
