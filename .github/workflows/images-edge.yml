# Images of every commit on main, for trying out what is not released yet: tags "edge" and "sha-<commit>".
# Released versions come from release.yml.
name: Images (edge)

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  edge:
    name: Image ${{ matrix.image }}
    # Only in the main repository, which has the Docker Hub secrets.
    if: github.repository == 'erik1g/study-manager'
    runs-on: ubuntu-latest
    # The Docker Hub secrets live in this environment, which may be used from main only.
    environment: edge
    strategy:
      matrix:
        image: [server, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/study-manager-${{ matrix.image }}
          tags: |
            type=edge,branch=main
            type=sha,format=short
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
