# Versions and releases from Conventional Commits (release-please), and the Docker images of a release.
#
# On every push to main release-please keeps a "release PR" up to date: the next version and the changelog.
# Merging that PR creates the tag v<version> and the GitHub release; then the images are built for
# amd64 and arm64 and pushed to Docker Hub with the tags <version>, <major>.<minor>, <major> and latest.
name: Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    # Only in the main repository, never in a fork.
    if: github.repository == 'erik1g/study-manager'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # the tag and the release
      pull-requests: write   # the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  images:
    name: Images ${{ matrix.image }}
    needs: release-please
    if: github.repository == 'erik1g/study-manager' && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # Publishing waits for the approval of the maintainer: the "release" environment has required reviewers
    # and may be deployed from main only. Nobody can publish images by merging a pull request alone.
    environment: release
    permissions:
      contents: read
      id-token: write      # keyless signing (cosign) and the provenance attestation
      attestations: write
    strategy:
      matrix:
        image: [server, web]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/study-manager-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}},value=${{ needs.release-please.outputs.tag_name }},enable=${{ !startsWith(needs.release-please.outputs.tag_name, 'v0.') }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=study-manager-${{ matrix.image }}
            org.opencontainers.image.licenses=GPL-3.0-only
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: infra/docker/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      # Anyone can check that an image comes from this workflow (see the admin documentation).
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Sign the image
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/study-manager-${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "docker.io/${IMAGE}@${DIGEST}"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: index.docker.io/${{ secrets.DOCKERHUB_USERNAME }}/study-manager-${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  bundle:
    name: Betreiber-Paket
    needs: release-please
    if: github.repository == 'erik1g/study-manager' && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # attach the files to the release
      id-token: write        # provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - name: Build the operator bundle
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          VERSION="${TAG#v}"
          DIR="study-manager-${VERSION}"
          mkdir -p "${DIR}/infra/db"
          # The Compose file of the bundle runs exactly this version unless STUDY_VERSION says otherwise.
          sed "s/\${STUDY_VERSION:-latest}/\${STUDY_VERSION:-${VERSION}}/g" docker-compose.yml > "${DIR}/docker-compose.yml"
          cp infra/db/roles.sql infra/db/jwt.sql "${DIR}/infra/db/"
          cp .env.example LICENSE "${DIR}/"
          cp infra/scripts/update.sh "${DIR}/update.sh"
          chmod +x "${DIR}/update.sh"
          printf '%s\n' "${VERSION}" > "${DIR}/VERSION"
          tar -czf "${DIR}.tar.gz" "${DIR}"
          # The same file under a name without the version, so that the link to the latest release stays the same.
          cp "${DIR}.tar.gz" study-manager.tar.gz
          sha256sum "${DIR}.tar.gz" study-manager.tar.gz > study-manager.sha256
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: study-manager*.tar.gz
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "${TAG}" study-manager*.tar.gz study-manager.sha256 --clobber
