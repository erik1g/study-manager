# Checks for every pull request (also those into a release branch like release/0.2) and every push to main:
# types, unit tests, UI check, build. Not on pushes to release branches: everything comes there by a checked
# pull request, and a push trigger on release/** would count as a release workflow for zizmor (cache poisoning). The end-to-end tests with the real container images run in e2e.yml, the check of the
# pull request's title in pr-title.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typen, Tests, Build
    runs-on: ubuntu-latest
    services:
      # The server's tests run against a real PostgreSQL, like the app does.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # The server's tests create their own database (study_test) on this server.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Datenbank vorbereiten
        # Like the Supabase image: extensions live in their own schema, which the role finds by its search path.
        run: psql "$DATABASE_URL" -c 'ALTER ROLE postgres SET search_path TO "$user", public, extensions'
      - name: UI-Prüfung (nur Bausteine aus @study/ui)
        run: node infra/scripts/ui-gate.mjs
      - name: Typprüfung
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Web-App bauen
        run: pnpm --filter @study/web build
      - name: Dokumentation bauen
        run: pnpm --filter @study/docs build

  workflows:
    name: Workflows prüfen (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
