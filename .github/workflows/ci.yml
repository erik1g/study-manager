# Checks for every pull request and every push to main: types, unit tests, UI check, build.
# The end-to-end tests with the real container images run in e2e.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typen, Tests, Build
    runs-on: ubuntu-latest
    services:
      # The server's tests run against a real PostgreSQL, like the app does.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # The server's tests create their own database (study_test) on this server.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Datenbank vorbereiten
        # Like the Supabase image: extensions live in their own schema, which the role finds by its search path.
        run: psql "$DATABASE_URL" -c 'ALTER ROLE postgres SET search_path TO "$user", public, extensions'
      - name: UI-Prüfung (nur Bausteine aus @study/ui)
        run: node infra/scripts/ui-gate.mjs
      - name: Typprüfung
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Web-App bauen
        run: pnpm --filter @study/web build
      - name: Dokumentation bauen
        run: pnpm --filter @study/docs build

  commit-title:
    name: Titel folgt Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

  workflows:
    name: Workflows prüfen (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
