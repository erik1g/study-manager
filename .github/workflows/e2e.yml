# The Playwright tests against the app as it is shipped: the server and web images are built from this
# checkout and started with infra/compose/test.yml. Longer than CI, so only for main and on demand, for pull requests
# into or out of a release branch (release/0.2 …), and for other pull requests that carry the label "e2e".
name: E2E

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, labeled, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright
    if: >-
      github.event_name != 'pull_request'
      || startsWith(github.event.pull_request.base.ref, 'release/')
      || (startsWith(github.event.pull_request.head.ref, 'release/') && github.event.pull_request.head.repo.full_name == github.repository)
      || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @study/e2e...
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Test-Stack bauen, füllen und Tests laufen lassen
        run: ./infra/test/stack.sh e2e --reporter=line,html
      - name: Testbericht sichern
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 7
      - name: Logs des Stacks
        if: failure()
        run: docker compose -p study-test --env-file .env.test -f docker-compose.yml -f infra/compose/test.yml logs --no-color --tail 200
      - name: Aufräumen
        if: always()
        run: ./infra/test/stack.sh reset
