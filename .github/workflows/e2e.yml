# The Playwright tests against the app as it is shipped: the server and web images are built from this
# checkout and started with docker-compose.test.yml. Longer than CI, so only for main and on demand,
# and for pull requests that carry the label "e2e".
name: E2E

on:
  push:
    branches: [main]
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @study/e2e...
      - uses: docker/setup-buildx-action@v3
      - name: Test-Stack bauen, füllen und Tests laufen lassen
        run: ./infra/test/stack.sh e2e --reporter=line,html
      - name: Testbericht sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 7
      - name: Logs des Stacks
        if: failure()
        run: docker compose -p study-test --env-file .env.test -f docker-compose.yml -f docker-compose.test.yml logs --no-color --tail 200
      - name: Aufräumen
        if: always()
        run: ./infra/test/stack.sh reset
