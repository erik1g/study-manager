# The title of a pull request becomes the commit title on a squash merge, and release-please makes versions and
# the changelog from it, so it has to follow Conventional Commits. In a workflow of its own, because it also runs
# when only the title is edited: in ci.yml an edit would cancel the running checks of the same pull request.
name: PR-Titel

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  commit-title:
    name: Titel folgt Conventional Commits
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@0723387faaf9b38adef4775cd42cfd5155ed6017 # v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
