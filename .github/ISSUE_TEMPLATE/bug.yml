name: Report a bug
description: Something does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for your report! Please write in English. Please do **not** report security vulnerabilities here, but privately (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      placeholder: "1. …\n2. …\n3. …"
  - type: input
    id: version
    attributes:
      label: Version
      description: From the image tag (`STUDY_VERSION`), e.g. 0.1.0, or the commit hash for your own development build.
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: "e.g. Safari 18 on iPhone, Chrome on Windows"
  - type: textarea
    id: logs
    attributes:
      label: Error messages or logs
      render: shell
