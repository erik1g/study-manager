name: Idea or wish
description: Suggest a new feature or an improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for your idea! Please write in English.
  - type: textarea
    id: problem
    attributes:
      label: Which problem do you want to solve?
      description: Describe what you are missing in your everyday studies, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What could it look like?
  - type: dropdown
    id: help
    attributes:
      label: Would you like to work on it yourself?
      options: ["Yes, I'll build it", "Yes, with some help", "No, I only wish for it"]
